# ── Single-material uniformity health-check designs ──────────────────────────
# Quick runs to check per-chamber uniformity for each core material.
#
# name:       material formula as written in SP header design field
# target_nm:  nominal layer thickness for this check
# aliases:    alternate names the operator might write in the SP title
# color:      hex color used in the dashboard trend chart

materials:
  - name: Ta2O5
    target_nm: 300
    aliases: []
    color: "#1f77b4"

  - name: SiO2
    target_nm: 300
    aliases: []
    color: "#ff7f0e"

  - name: Nb2O5
    target_nm: 300
    aliases: []
    color: "#2ca02c"

  - name: HfO2
    target_nm: 250
    aliases: [Hf]
    color: "#d62728"

  - name: Al2O3
    target_nm: 300
    aliases: [Al2O3]
    color: "#9467bd"

  - name: TiO2
    target_nm: 200
    aliases: [TiO2]
    color: "#8c564b"


# ── Multi-material combination uniformity health-check designs ────────────────
# Standard layer stacks run to check uniformity of combined material systems.
#
# label:    display name shown in the dropdown
# keywords: ALL of these tokens must appear (case-insensitive) in the SP
#           header design field for the run to match.  Use short root tokens
#           (hw, 16l, 8l, hf, al2o3) so they match regardless of exact phrasing,
#           e.g. "Uniformity HW 16L", "HW 16L Ta-SiO2-V1", "16L Hf-SiO2" all
#           match using these rules.
# color:    hex color for the trend chart

designs:
  - label: "Uniformity HW 16L Ta-SiO2"
    keywords: [hw, 16l]
    color: "#1f77b4"

  - label: "Uniformity HW 8L Ta-SiO2"
    keywords: [hw, 8l]
    color: "#ff7f0e"

  - label: "Uniformity 16L Hf-SiO2"
    keywords: [16l, hf]
    color: "#d62728"

  - label: "Uniformity 16L Al2O3-SiO2"
    keywords: [16l, al2o3]
    color: "#9467bd"
